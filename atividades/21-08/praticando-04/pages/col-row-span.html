<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas com colspan e rowspan</title>
    <link rel="icon" type="image/pencil-on-paper" href="../imgs/icon-col-row.png">

    <!-- codigo css -->
    <style>
        table, td {
            border: 1px solid red
        }
        td{
            padding:30px 60px;
            text-align:center
        }
    </style>    

</head>
<body>

    <h1>Página 02 - Tabelas com rowspan e colspan</h1>
    <br>

    <h3>tabela com colspan</h3>
    <table>
        <tr>
            <td colspan="3">Colspan</td>
        </tr>
        <tr>
            <td>x</td>
            <td>x</td>
            <td>x</td>
        </tr>
    </table>

    <br><br>

    <h3>tabela com rowspan</h3>
    <table>
        <tr>
            <td>x</td>
            <td rowspan="3">Rowspan</td>
        </tr>
        <tr>
            <td>x</td>
        </tr>
        <tr>    
            <td>x</td>
        </tr>
    </table>    

    <br><br>

    <h3>tabela com colspan e rowspan</h3>
    <table>
        <tr>
            <td colspan="2">Colspan</td>

            <td>x</td>
            <td rowspan="4">Rowspan</td>
        </tr>

        <tr>
            <td>x</td>
            <td>x</td>
            <td>x</td>
        </tr>

        <tr>
            <td>x</td> 
            <td colspan="2">Colspan</td>          
        </tr>

        <tr>
            <td>x</td>
            <td>x</td> 
            <td>x</td>              
        </tr>
    </table> 

    <br><br>
    <footer>
        <a href="../pages/index.html">voltar a pagina principal</a>
            <p>Barbara Diniz © 2026 </p>
    </footer>
</body>

</html>
