<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 02</title>

    <style>
        #tabela{
            border: 2px solid red
        }
        #td-tabela{
            border: 2px solid red;
            padding:30px 60px;
            text-align:center;
        }
        td{
            text-align: center;
            border: 2px solid red;
            padding: 5px 10px;
        }
        .col-row-verde{
            background-color: green;
        }
        .col-row-verm{
            background-color: red;
        }
        .col-row-azul{
            background-color:blue;
        }    
        .col-row-amarelo{
            background-color: yellow;
        }        
       
    </style>


</head>
<body>
    <h1>Atividade 02 - Tabela grande com rowspan e colspan colorida com CSS</h1>
    <table id="tabela">
            <tr>
                <td id="td-tabela" class="col-row-verde" colspan="2">Colspan</td>
                <td id="td-tabela" class="col-row-verde">x</td>
                <td id="td-tabela" class="col-row-verde" rowspan="3">Rowspan</td>
            </tr>
            </div>
            <tr>
                <td id="td-tabela" class="col-row-verm">x</td>
                <td id="td-tabela" class="col-row-verm">x</td>
                <td id="td-tabela" class="col-row-verm">x</td>
            </tr>

            <tr>
                <td id="td-tabela" class="col-row-azul">x</td> 
                <td id="td-tabela" class="col-row-azul" colspan="2">Colspan</td>     
            </tr>

            <tr>
                <td id="td-tabela" class="col-row-amarelo">x</td>
                <td id="td-tabela" class="col-row-amarelo">x</td> 
                <td id="td-tabela" class="col-row-amarelo">x</td>
                <td id="td-tabela" class="col-row-amarelo">x</td>              
            </tr>
    </table>
    <br>
    <table id="tabela">
        <caption>Legenda</caption>
        <tr>
            <td>Linha 1</td>
            <td class="col-row-verde"> - - - - - - </td>
            <td>green</td>
        </tr>
        <tr>
            <td>Linha 2</td>
            <td class="col-row-verm"> - - - - - - </td>
            <td>red</td>
        </tr>
        <tr>
            <td>Linha 3</td>
            <td class="col-row-azul"> - - - - - - </td>
            <td>blue</td>
        </tr>                
        <tr>
            <td>Linha 4</td>
            <td class="col-row-amarelo"> - - - - - - </td>
            <td>yellow</td>
        </tr>        
    </table>

</body>
</html>
